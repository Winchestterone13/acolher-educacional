<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="100%" height="100%" role="img" aria-label="Sinais corporais de emoção e sobrecarga">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background card -->
  <rect width="240" height="380" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Stylized human silhouette -->
  <!-- Head -->
  <circle cx="120" cy="55" r="28" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <!-- Brain / thoughts indicator -->
  <circle cx="120" cy="52" r="14" fill="#fed7aa" opacity="0.8" />
  <text x="120" y="56" font-size="12" text-anchor="middle">💭</text>
  
  <!-- Neck & Torso -->
  <path d="M 112,85 L 128,85 L 138,105 L 152,190 L 88,190 L 102,105 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Arms -->
  <path d="M 88,108 L 60,185 L 72,190 L 98,125" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  <path d="M 152,108 L 180,185 L 168,190 L 142,125" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
  
  <!-- Heart zone (accelerated heartbeat) -->
  <circle cx="125" cy="125" r="18" fill="#fee2e2" />
  <circle cx="125" cy="125" r="10" fill="#ef4444" opacity="0.85" />
  <text x="125" y="129" font-size="12" text-anchor="middle">💓</text>

  <!-- Hands zone (tension / sweat) -->
  <circle cx="58" cy="195" r="12" fill="#e0f2fe" />
  <text x="58" y="199" font-size="10" text-anchor="middle">💧</text>
  <circle cx="182" cy="195" r="12" fill="#e0f2fe" />
  <text x="182" y="199" font-size="10" text-anchor="middle">💧</text>

  <!-- Stomach zone (butterfly / knots) -->
  <circle cx="120" cy="165" r="14" fill="#fef3c7" />
  <text x="120" y="169" font-size="11" text-anchor="middle">⚡</text>

  <!-- Legs -->
  <path d="M 98,192 L 95,300 L 110,300 L 115,192 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <path d="M 125,192 L 130,300 L 145,300 L 142,192 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />

  <!-- Indicator labels at bottom -->
  <text x="120" y="335" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Sinais Físicos</text>
  <text x="120" y="352" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Coração • Respiração • Tensão</text>
</svg>
