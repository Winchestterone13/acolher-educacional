<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="100%" height="100%" role="img" aria-label="Ilustração para professores">
  <defs>
    <linearGradient id="profBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="profShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background shape -->
  <path d="M 40,160 C 20,60 140,20 260,30 C 380,40 460,100 440,220 C 420,320 330,350 200,345 C 80,340 50,250 40,160 Z" fill="url(#profBg)" />

  <!-- Blackboard / Educational board card -->
  <g transform="translate(100, 60)" filter="url(#profShadow)">
    <rect width="280" height="170" rx="16" fill="url(#boardGrad)" />
    <!-- Inner board outline -->
    <rect x="10" y="10" width="260" height="150" rx="10" fill="none" stroke="#334155" stroke-width="2" />
    <!-- Empathy equation on board -->
    <text x="140" y="55" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">PRÁTICA PEDAGÓGICA</text>
    <text x="140" y="85" font-family="Inter, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">Observar • Escutar • Adaptar</text>
    <line x1="50" y1="105" x2="230" y2="105" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Checkmarks -->
    <text x="70" y="135" font-family="Inter, sans-serif" font-size="12" fill="#4ade80">✓ Comunicação Clara</text>
    <text x="195" y="135" font-family="Inter, sans-serif" font-size="12" fill="#4ade80">✓ Acolhimento</text>
  </g>

  <!-- Floating strategy card 1 -->
  <g transform="translate(50, 220)" filter="url(#profShadow)">
    <rect width="170" height="65" rx="14" fill="#ffffff" />
    <circle cx="28" cy="32" r="14" fill="#dbeafe" />
    <text x="28" y="37" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🗓️</text>
    <text x="52" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Previsibilidade</text>
    <text x="52" y="44" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Antecipar etapas</text>
  </g>

  <!-- Floating strategy card 2 -->
  <g transform="translate(250, 220)" filter="url(#profShadow)">
    <rect width="180" height="65" rx="14" fill="#ffffff" />
    <circle cx="28" cy="32" r="14" fill="#d1fae5" />
    <text x="28" y="37" font-family="Inter, sans-serif" font-size="14" text-anchor="middle">🤝</text>
    <text x="52" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e293b">Parceria</text>
    <text x="52" y="44" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Família e equipe</text>
  </g>
</svg>
